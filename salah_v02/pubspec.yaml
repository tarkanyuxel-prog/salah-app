name: salah
description: Salah - modern prayer, Ramadan and Quran audio app
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  just_audio: ^0.9.42
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/kaaba_icon.png"
  adaptive_icon_background: "#0B6B5C"
  adaptive_icon_foreground: "assets/images/kaaba_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
