name: salah
description: Salah - modern prayer, Ramadan and Quran audio app
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  just_audio: ^0.9.42
  flutter_tts: ^4.2.3
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  path_provider: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
